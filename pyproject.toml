[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-server-toolkit"
version = "1.0.0"
description = "A Model Context Protocol (MCP) server toolkit for connecting AI agents to external tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "fzs356113-oss" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "sqlalchemy>=2.0.0",
]

[project.scripts]
mcp-server-toolkit = "mcp_server_toolkit.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
